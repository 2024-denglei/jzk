[project]
name = "jzk"
version = "6.0.0"
description = "捐精人匹配系统：偏好画像匹配、分支化顾问对话与管理端"
# 与 Dockerfile 的 python:3.12-slim 对齐。放宽成 >=3.12 会让 uv 在开发机上挑一个
# 更新的解释器，于是本地测的是 cp314 的 wheel、线上发的是 cp312 的。升级 Python
# 须同时改这里和 Dockerfile 的基础镜像。
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    # 直接依赖：jzk.api.match 与 jzk.domain.preference.scoring_client 都 import httpx。
    # 新版 openai SDK 依赖的是 httpx2，不再顺带装上 httpx，所以必须自己声明。
    "httpx>=0.27,<1",
    "openai>=1.51.0",
    "openpyxl>=3.1.5",
    "xlrd>=2.0.1",
    "pandas>=2.2.0",
    "scikit-learn>=1.5.0",
    "numpy>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0.0,<4.1",
    "python-jose[cryptography]>=3.3.0",
    "psycopg[binary,pool]>=3.2.0",
    "redis>=5.2.0",
    # 精确钉住：docs/adr/0001 要求线上与离线共用同一检查点，那么加载它的 torch
    # 构建也属于那份契约。放宽成 >= 会让不同环境拿到不同构建，而推理结果不一致
    # 既不报错也没有堆栈，是最难定位的一类缺陷。升级须显式改这一行。
    "torch==2.14.0",
]

[dependency-groups]
# 只在开发与 CI 用，不进运行镜像。
dev = [
    "pytest>=8.0.0",
    # tests/test_ci_workflow.py 用它结构化解析工作流。
    "PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jzk"]

# 可安装包：pytest 通过 editable install 找到 `jzk`，不再靠 pythonpath=.
[tool.uv]
package = true

# torch 只从 CPU 专用源取。默认的 PyPI 版在 Linux 上会拖进整套 nvidia-* CUDA
# 运行时（近 3 GB），而这个项目只做推理，不需要 GPU。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# 测试仍在仓库根 tests/。从 backend/ 跑 pytest 时 rootdir 是本文件所在目录。
[tool.pytest.ini_options]
testpaths = ["../tests"]
