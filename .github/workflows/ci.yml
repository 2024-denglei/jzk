name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jzk
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_postgres_pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d jzk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      # 不需要预置 db/postgres 下的建库 SQL：db.pg.ensure_schema() 会在首次连接时
      # 自己执行它们，所以这里用一个空的 postgres 就够。
      TEST_DATABASE_URL: postgresql://postgres:ci_postgres_pw@127.0.0.1:5432/jzk
      DATABASE_URL: postgresql://postgres:ci_postgres_pw@127.0.0.1:5432/jzk
      DATABASE_ADMIN_URL: postgresql://postgres:ci_postgres_pw@127.0.0.1:5432/jzk
      DATABASE_MIGRATOR_URL: postgresql://postgres:ci_postgres_pw@127.0.0.1:5432/jzk
      # 有两个测试会真的读写 Redis Stream，不能省掉这个服务。
      REDIS_URL: redis://127.0.0.1:6379/0

    steps:
      - uses: actions/checkout@v7

      # setup-uv 的浮动大版本标签只发到 v7，之后只有具体版本，所以这里钉精确 tag。
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          version: '0.11.28'
          enable-cache: true

      - name: 安装依赖
        # --locked 会在 pyproject.toml 改了却忘记重新锁定时直接失败，因此 CI 装的
        # 依赖不可能与 uv.lock 不一致。Python 版本与 torch 的 CPU 源都由 pyproject
        # 决定，这里不再重复声明。
        run: uv sync --locked --directory backend

      - name: 跑全量测试
        run: uv run --locked --directory backend pytest -q

  frontend:
    name: 前端检查
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 与 Dockerfile 的构建阶段保持同一大版本。
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npx tsc -b

      - name: 单元测试
        run: npm test

      - name: Lint
        run: npx oxlint
