<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <style>
      .title { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 30px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 17px; fill: #374151; }
      .panel-title { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 19px; font-weight: 700; fill: #111827; }
      .layer-title { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 17px; font-weight: 700; fill: #1f2937; }
      .module-title { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .module-text { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 12.5px; fill: #374151; }
      .small-text { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 11.5px; fill: #4b5563; }
      .caption { font-family: Arial, 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #374151; }
      .code { font-family: Consolas, 'Courier New', monospace; font-size: 11.5px; fill: #374151; }
      .panel { fill: #ffffff; stroke: #d1d5db; stroke-width: 1.6; rx: 14; }
      .layer { fill: #f9fafb; stroke: #9ca3af; stroke-width: 1.3; rx: 12; }
      .client { fill: #eef2ff; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .api { fill: #f0f9ff; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .dialogue { fill: #f8fafc; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .core { fill: #f7fee7; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .external { fill: #fff7ed; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .data { fill: #fefce8; stroke: #64748b; stroke-width: 1.2; rx: 9; }
      .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; rx: 8; }
      .arrow { stroke: #374151; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #64748b; stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; marker-end: url(#arrow-soft); }
      .arrow-data { stroke: #2563eb; stroke-width: 2; fill: none; marker-end: url(#arrow-blue); }
      .arrow-return { stroke: #059669; stroke-width: 2; fill: none; marker-end: url(#arrow-green); }
      .badge { fill: #111827; }
      .badge-text { font-family: Arial, sans-serif; font-size: 11px; font-weight: 700; fill: white; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151" />
    </marker>
    <marker id="arrow-soft" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b" />
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#059669" />
    </marker>
  </defs>

  <rect width="1800" height="1120" fill="#ffffff"/>

  <!-- Header -->
  <text x="900" y="50" text-anchor="middle" class="title">智能生育匹配对话智能体系统架构</text>
  <text x="900" y="80" text-anchor="middle" class="subtitle">Architecture of an LLM-assisted Fertility Donor Matching Dialogue Agent</text>

  <!-- Panel A: Overall architecture -->
  <rect x="50" y="110" width="1700" height="650" class="panel"/>
  <text x="78" y="142" class="panel-title">A. 系统分层架构与数据流</text>
  <text x="78" y="166" class="caption">自然语言理解由 LLM 完成；候选人筛选由可解释匹配引擎完成。蓝色箭头表示请求/数据流，绿色箭头表示结果返回。</text>

  <!-- User Layer -->
  <rect x="85" y="205" width="245" height="430" class="layer"/>
  <text x="207" y="232" text-anchor="middle" class="layer-title">用户交互层</text>
  <text x="207" y="253" text-anchor="middle" class="small-text">Client Interaction Layer</text>

  <rect x="110" y="285" width="195" height="85" class="client"/>
  <text x="207" y="310" text-anchor="middle" class="module-title">Web 对话界面</text>
  <text x="207" y="334" text-anchor="middle" class="module-text">文本输入 / 候选人卡片</text>
  <text x="207" y="354" text-anchor="middle" class="code">frontend/index.html</text>

  <rect x="110" y="400" width="195" height="85" class="client"/>
  <text x="207" y="425" text-anchor="middle" class="module-title">语音交互原型</text>
  <text x="207" y="449" text-anchor="middle" class="module-text">ASR / TTS</text>
  <text x="207" y="469" text-anchor="middle" class="code">Web Speech API</text>

  <rect x="110" y="515" width="195" height="85" class="client"/>
  <text x="207" y="540" text-anchor="middle" class="module-title">流式响应渲染</text>
  <text x="207" y="564" text-anchor="middle" class="module-text">SSE token + 结果卡片</text>
  <text x="207" y="584" text-anchor="middle" class="code">Event Stream</text>

  <!-- API Layer -->
  <rect x="390" y="205" width="285" height="430" class="layer"/>
  <text x="532" y="232" text-anchor="middle" class="layer-title">服务接口层</text>
  <text x="532" y="253" text-anchor="middle" class="small-text">FastAPI Service Layer</text>

  <rect x="420" y="285" width="225" height="70" class="api"/>
  <text x="532" y="310" text-anchor="middle" class="module-title">应用入口与依赖注入</text>
  <text x="532" y="333" text-anchor="middle" class="code">main.py</text>

  <rect x="420" y="380" width="225" height="70" class="api"/>
  <text x="532" y="405" text-anchor="middle" class="module-title">同步对话接口</text>
  <text x="532" y="428" text-anchor="middle" class="code">POST /api/chat</text>

  <rect x="420" y="475" width="225" height="70" class="api"/>
  <text x="532" y="500" text-anchor="middle" class="module-title">流式对话接口</text>
  <text x="532" y="523" text-anchor="middle" class="code">POST /api/chat/stream</text>

  <rect x="420" y="570" width="225" height="42" class="api"/>
  <text x="532" y="596" text-anchor="middle" class="module-title">反馈接口 /api/feedback</text>

  <!-- Dialogue Layer -->
  <rect x="735" y="205" width="360" height="430" class="layer"/>
  <text x="915" y="232" text-anchor="middle" class="layer-title">对话与语义理解层</text>
  <text x="915" y="253" text-anchor="middle" class="small-text">Dialogue and NLU Layer</text>

  <rect x="770" y="285" width="290" height="70" class="dialogue"/>
  <text x="915" y="310" text-anchor="middle" class="module-title">会话上下文管理</text>
  <text x="915" y="333" text-anchor="middle" class="code">session.py: state, history, features, constraints</text>

  <rect x="770" y="380" width="290" height="82" class="dialogue"/>
  <text x="915" y="405" text-anchor="middle" class="module-title">LLM 语义解析</text>
  <text x="915" y="429" text-anchor="middle" class="module-text">intent + features + constraints</text>
  <text x="915" y="449" text-anchor="middle" class="code">nlu.py</text>

  <rect x="770" y="487" width="290" height="70" class="dialogue"/>
  <text x="915" y="512" text-anchor="middle" class="module-title">对话状态机</text>
  <text x="915" y="535" text-anchor="middle" class="code">START→COLLECTING→MATCHING→PRESENTING</text>

  <rect x="770" y="582" width="290" height="42" class="dialogue"/>
  <text x="915" y="608" text-anchor="middle" class="module-title">回复生成 response_gen.py</text>

  <!-- Matching Core -->
  <rect x="1160" y="205" width="360" height="430" class="layer"/>
  <text x="1340" y="232" text-anchor="middle" class="layer-title">核心匹配层</text>
  <text x="1340" y="253" text-anchor="middle" class="small-text">Feature-based Matching Engine</text>

  <rect x="1195" y="285" width="290" height="58" class="core"/>
  <text x="1340" y="309" text-anchor="middle" class="module-title">数据加载与清洗</text>
  <text x="1340" y="329" text-anchor="middle" class="code">data_loader.py</text>

  <rect x="1195" y="365" width="290" height="72" class="core"/>
  <text x="1340" y="389" text-anchor="middle" class="module-title">特征工程与查询编码</text>
  <text x="1340" y="412" text-anchor="middle" class="module-text">26-D vector + specified-feature mask</text>
  <text x="1340" y="430" text-anchor="middle" class="code">feature_engine.py</text>

  <rect x="1195" y="459" width="290" height="72" class="core"/>
  <text x="1340" y="483" text-anchor="middle" class="module-title">动态硬约束过滤</text>
  <text x="1340" y="506" text-anchor="middle" class="module-text">must → filter, prefer → rank only</text>
  <text x="1340" y="524" text-anchor="middle" class="code">matcher.py: hard_filter()</text>

  <rect x="1195" y="553" width="290" height="72" class="core"/>
  <text x="1340" y="577" text-anchor="middle" class="module-title">相似度融合与排序解释</text>
  <text x="1340" y="600" text-anchor="middle" class="module-text">0.6 cosine + 0.4 Euclidean, Top-K</text>
  <text x="1340" y="618" text-anchor="middle" class="code">matcher.py / ranker.py</text>

  <!-- External Resources -->
  <rect x="1580" y="245" width="130" height="105" class="external"/>
  <text x="1645" y="274" text-anchor="middle" class="module-title">LLM 服务</text>
  <text x="1645" y="299" text-anchor="middle" class="module-text">DeepSeek / OpenAI</text>
  <text x="1645" y="322" text-anchor="middle" class="code">base_url</text>

  <rect x="1580" y="470" width="130" height="105" class="data"/>
  <text x="1645" y="499" text-anchor="middle" class="module-title">数据源</text>
  <text x="1645" y="524" text-anchor="middle" class="module-text">Excel 表格</text>
  <text x="1645" y="547" text-anchor="middle" class="code">234 records</text>

  <!-- Numbered dataflow arrows -->
  <circle cx="352" cy="510" r="13" class="badge"/><text x="352" y="514" text-anchor="middle" class="badge-text">1</text>
  <path d="M305 510 C335 510, 365 510, 420 510" class="arrow-data"/>
  <text x="360" y="493" text-anchor="middle" class="small-text">user query</text>

  <circle cx="705" cy="421" r="13" class="badge"/><text x="705" y="425" text-anchor="middle" class="badge-text">2</text>
  <path d="M645 510 C700 510, 705 421, 770 421" class="arrow-data"/>
  <text x="708" y="476" text-anchor="middle" class="small-text">request</text>

  <circle cx="1130" cy="421" r="13" class="badge"/><text x="1130" y="425" text-anchor="middle" class="badge-text">3</text>
  <path d="M1060 421 C1120 421, 1125 392, 1195 401" class="arrow-data"/>
  <text x="1130" y="382" text-anchor="middle" class="small-text">features + mask</text>

  <circle cx="1538" cy="495" r="13" class="badge"/><text x="1538" y="499" text-anchor="middle" class="badge-text">4</text>
  <path d="M1485 495 C1520 495, 1540 522, 1580 522" class="arrow-soft"/>
  <text x="1532" y="540" text-anchor="middle" class="small-text">load table</text>

  <circle cx="1128" cy="589" r="13" class="badge"/><text x="1128" y="593" text-anchor="middle" class="badge-text">5</text>
  <path d="M1195 589 C1138 606, 1110 603, 1060 603" class="arrow-return"/>
  <text x="1128" y="628" text-anchor="middle" class="small-text">ranked candidates</text>

  <circle cx="700" cy="603" r="13" class="badge"/><text x="700" y="607" text-anchor="middle" class="badge-text">6</text>
  <path d="M770 603 C685 650, 500 648, 305 558" class="arrow-return"/>
  <text x="585" y="675" text-anchor="middle" class="small-text">SSE reply + donor cards</text>

  <path d="M1060 421 C1235 250, 1425 285, 1580 298" class="arrow-soft"/>
  <text x="1325" y="265" text-anchor="middle" class="small-text">LLM semantic parsing</text>

  <!-- Panel B: Matching pipeline -->
  <rect x="50" y="790" width="1080" height="260" class="panel"/>
  <text x="78" y="822" class="panel-title">B. 核心匹配算法管线</text>

  <rect x="95" y="865" width="150" height="78" class="data"/>
  <text x="170" y="891" text-anchor="middle" class="module-title">Donor Table</text>
  <text x="170" y="914" text-anchor="middle" class="module-text">raw attributes</text>
  <text x="170" y="932" text-anchor="middle" class="code">Excel</text>

  <rect x="290" y="865" width="165" height="78" class="core"/>
  <text x="372" y="891" text-anchor="middle" class="module-title">Feature Encoder</text>
  <text x="372" y="914" text-anchor="middle" class="module-text">ordinal / min-max</text>
  <text x="372" y="932" text-anchor="middle" class="module-text">one-hot</text>

  <rect x="500" y="865" width="165" height="78" class="core"/>
  <text x="582" y="891" text-anchor="middle" class="module-title">Query Encoder</text>
  <text x="582" y="914" text-anchor="middle" class="module-text">vector q</text>
  <text x="582" y="932" text-anchor="middle" class="module-text">feature mask m</text>

  <rect x="710" y="865" width="170" height="78" class="core"/>
  <text x="795" y="891" text-anchor="middle" class="module-title">Constraint Gate</text>
  <text x="795" y="914" text-anchor="middle" class="module-text">constraints[f] = must</text>
  <text x="795" y="932" text-anchor="middle" class="module-text">hard exclusion</text>

  <rect x="925" y="865" width="160" height="78" class="core"/>
  <text x="1005" y="891" text-anchor="middle" class="module-title">Ranker</text>
  <text x="1005" y="914" text-anchor="middle" class="module-text">masked similarity</text>
  <text x="1005" y="932" text-anchor="middle" class="module-text">Top-5 + reasons</text>

  <path d="M245 904 L290 904" class="arrow"/>
  <path d="M455 904 L500 904" class="arrow"/>
  <path d="M665 904 L710 904" class="arrow"/>
  <path d="M880 904 L925 904" class="arrow"/>

  <rect x="175" y="978" width="820" height="45" class="note"/>
  <text x="585" y="998" text-anchor="middle" class="caption">Scoring: s = 0.6 · cosine(q[m], X[m]) + 0.4 · (1 − normalized_euclidean(q[m], X[m]))</text>
  <text x="585" y="1018" text-anchor="middle" class="caption">Only user-specified dimensions are scored; must-level fields are filtered before ranking.</text>

  <!-- Panel C: Constraint semantics -->
  <rect x="1170" y="790" width="580" height="260" class="panel"/>
  <text x="1198" y="822" class="panel-title">C. 语气驱动的硬/软约束机制</text>

  <rect x="1215" y="855" width="235" height="78" class="external"/>
  <text x="1332" y="881" text-anchor="middle" class="module-title">User utterance</text>
  <text x="1332" y="905" text-anchor="middle" class="module-text">“必须 / 一定要 / 只要”</text>
  <text x="1332" y="923" text-anchor="middle" class="module-text">“最好 / 希望 / 尽量”</text>

  <rect x="1485" y="855" width="220" height="78" class="dialogue"/>
  <text x="1595" y="881" text-anchor="middle" class="module-title">LLM output</text>
  <text x="1595" y="905" text-anchor="middle" class="code">constraints[field]</text>
  <text x="1595" y="923" text-anchor="middle" class="code">must | prefer</text>

  <path d="M1450 894 L1485 894" class="arrow-data"/>

  <rect x="1215" y="965" width="490" height="55" class="note"/>
  <text x="1460" y="987" text-anchor="middle" class="caption">must: hard_filter excludes non-conforming donors</text>
  <text x="1460" y="1008" text-anchor="middle" class="caption">prefer: similarity ranking is affected, but donors are not removed</text>

  <!-- Footer -->
  <text x="900" y="1090" text-anchor="middle" class="caption">Figure 1. Research-style architecture diagram of the LLM-assisted donor matching system. The design separates semantic parsing from deterministic, explainable matching.</text>
</svg>
