<text x="309" y="519" font-size="9" fill="#333">• dim[4-42]: 体型/肤色/血型…（one-hot）</text>
<text x="309" y="531" font-size="9" fill="#333">• encode_query → ( 43维向量, mask数组 )</text>

<rect x="554" y="461" width="247" height="86" rx="5" fill="white" stroke="#82c99d" stroke-width="1.2"/>
