<line x1="554" y1="481" x2="801" y2="481" stroke="#b2dfca" stroke-width="1"/>
<text x="566" y="495" font-size="9" fill="#333">• 余弦×0.6 + 欧氏×0.4 融合得分</text>
<text x="566" y="507" font-size="9" fill="#333">• hard_filter：must 约束 AND 过滤</text>
<text x="566" y="519" font-size="9" fill="#333">• match_with_relaxation（top_k=50）</text>
<text x="566" y="531" font-size="9" fill="#333">• diagnose_no_match → 瓶颈字段列表</text>

<rect x="811" y="461" width="258" height="86" rx="5" fill="white" stroke="#82c99d" stroke-width="1.2"/>
<text x="940" y="477" text-anchor="middle" font-size="10.5" font-weight="700" fill="#1a5e37">排序与理由  ranker.py</text>
<line x1="811" y1="481" x2="1069" y2="481" stroke="#b2dfca" stroke-width="1"/>
<text x="823" y="495" font-size="9" fill="#333">• 文字字段软加分 +0.06/项</text>
<text x="823" y="507" font-size="9" fill="#333">  （籍贯 / 性格 / 职业 / 民族）</text>
<text x="823" y="519" font-size="9" fill="#333">• compute_field_match 逐字段比对</text>
<text x="823" y="531" font-size="9" fill="#333">• 命中率 % · 自然语言推荐理由</text>

