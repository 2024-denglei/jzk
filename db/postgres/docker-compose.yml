# 本地/演示用 PostgreSQL（政务生产环境请按 README 独立建库）
services:
  postgres:
    image: postgres:16-alpine
    container_name: jzk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jzk
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jzk_dev_change_me}
      # 应用角色初始密码（仅开发；生产在 03_roles.sql 执行前自行修改）
      JZK_APP_PASSWORD: ${JZK_APP_PASSWORD:-jzk_app_dev}
      JZK_ADMIN_PASSWORD: ${JZK_ADMIN_PASSWORD:-jzk_admin_dev}
      JZK_READONLY_PASSWORD: ${JZK_READONLY_PASSWORD:-jzk_ro_dev}
      JZK_MIGRATOR_PASSWORD: ${JZK_MIGRATOR_PASSWORD:-jzk_migrator_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - jzk_pg_data:/var/lib/postgresql/data
      - ./01_init_db.sql:/docker-entrypoint-initdb.d/01_init_db.sql:ro
      - ./02_schema.sql:/docker-entrypoint-initdb.d/02_schema.sql:ro
      - ./03_roles.sql:/docker-entrypoint-initdb.d/03_roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jzk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jzk_pg_data:
